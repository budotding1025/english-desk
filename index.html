<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>翻翻英语</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./theme-duo.css?v=12" />
  <script src="./assets/vendor/lottie.min.js"></script>
</head>
<body>
  <div class="screen" id="screenHome">
    <div class="top">
      <div class="brand">翻翻英语</div>
      <button type="button" class="icon-btn" id="btnSettings" aria-label="设置">⚙</button>
    </div>
    <div class="home-main">
      <div class="mascot-stage">
        <div class="mascot-wrap" aria-label="翻翻英语：乌龟坚持，蜜蜂开口">
          <div class="mascot mascot-turtle is-on" id="lottieTurtle" role="img" aria-label="翻翻龟">
            <img class="mascot-fallback" src="./assets/turtle.png" alt="翻翻龟" width="148" height="148" />
          </div>
          <div class="mascot mascot-bee" id="lottieBee" role="img" aria-label="翻翻蜂">
            <img class="mascot-fallback" src="./assets/bee.png" alt="翻翻蜂" width="148" height="148" />
          </div>
          <i class="spark s1"></i>
          <i class="spark s2"></i>
          <i class="spark s3"></i>
        </div>
      </div>
      <p class="mascot-line" id="mascotLine">每天进步一点点，有一天比兔子跑得还远。</p>
      <p class="streak" id="streakLine">连续 <strong>0</strong> 天</p>
      <div class="today-card">
        <p class="eyebrow" id="sessionEyebrow">今天</p>
        <h1 id="sessionTitle">词听练习</h1>
        <p class="meta" id="sessionMeta">约 18 分钟 · Agent 带练</p>
        <button type="button" class="btn-start" id="btnStart">开始</button>
      </div>
      <p class="unit-line" id="unitLine">Unit 1</p>
    </div>
  </div>

  <!-- LESSON -->
  <div class="screen hidden" id="screenLesson">
    <div class="lesson-top">
      <button type="button" class="icon-btn" id="btnCloseLesson" aria-label="关闭">×</button>
      <div class="progress" aria-hidden="true"><i id="progressFill"></i></div>
      <button type="button" class="icon-btn" id="btnMute" aria-label="静音" title="语音开闭">♪</button>
    </div>
    <div class="lesson-body">
      <p class="card-type" id="cardType">词</p>
      <p class="card-prompt" id="cardPrompt">—</p>
      <p class="card-sub" id="cardSub"></p>
      <div id="cardExtra"></div>
      <div class="lesson-actions" id="cardActions"></div>
    </div>
  </div>

  <!-- DONE -->
  <div class="screen hidden" id="screenDone">
    <div class="done-main">
      <h1>今日完成</h1>
      <p class="meta" id="doneScore" style="color:var(--muted)">—</p>
      <div class="egg" id="doneEgg"></div>
      <div id="donePractice" class="done-practice"></div>
      <button type="button" class="btn-start hidden" id="btnHome">回首页</button>
    </div>
  </div>

  <!-- SETTINGS -->
  <div class="overlay hidden" id="settingsOverlay" aria-hidden="true">
    <div class="sheet" role="dialog" aria-labelledby="settingsTitle">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h2 id="settingsTitle">设置</h2>
        <button type="button" class="icon-btn" id="btnCloseSettings" aria-label="关闭">×</button>
      </div>
      <label for="unitSelect">单元</label>
      <select id="unitSelect"></select>
      <label>口音</label>
      <div class="row">
        <button type="button" class="chip active" data-accent="en-US">美式</button>
        <button type="button" class="chip" data-accent="en-GB">英式</button>
      </div>
      <label>语音</label>
      <div class="row">
        <button type="button" class="chip active" id="btnVoiceOn">开</button>
        <button type="button" class="chip" id="btnVoiceOff">关</button>
        <button type="button" class="chip" id="btnVoicePreview">试听四角色</button>
      </div>
      <div class="cast-mini" id="castMap"></div>
    </div>
  </div>

  <script src="./data.js"></script>
  <script src="./voice.js"></script>
  <script>
    (function () {
      const DATA = window.ENGLISH_DESK_DATA;
      const Lesson = window.EnglishDeskLesson;
      const V = window.EnglishVoice;
      const STORE_KEY = "english-desk-v3";

      const $ = (id) => document.getElementById(id);
      const state = {
        view: "home",
        unitId: "u1",
        sessionId: "weekdayListen",
        cards: [],
        index: 0,
        results: [],
        revealed: false,
        listenLocked: false,
        sortAssign: {},
        sortActive: null,
      };

      function loadStore() {
        try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); }
        catch (e) { return {}; }
      }
      function saveStore(partial) {
        const next = Object.assign({}, loadStore(), partial);
        localStorage.setItem(STORE_KEY, JSON.stringify(next));
        return next;
      }
      function todayKey() {
        return new Date().toISOString().slice(0, 10);
      }
      function unit() {
        return DATA.units.find((u) => u.id === state.unitId) || DATA.units[0];
      }
      function card() {
        return state.cards[state.index] || null;
      }

      function streakDays() {
        const logs = loadStore().logs || {};
        const keys = Object.keys(logs).filter((k) => logs[k] && logs[k].done).sort().reverse();
        if (!keys.length) return 0;
        let n = 0;
        const d = new Date();
        for (;;) {
          const key = d.toISOString().slice(0, 10);
          if (logs[key] && logs[key].done) {
            n += 1;
            d.setDate(d.getDate() - 1);
          } else if (n === 0 && key === todayKey()) {
            d.setDate(d.getDate() - 1);
          } else break;
        }
        return n;
      }

      let homeAudio = null;
      let homeAudioDone = null;
      let cancelHomeIntro = function () {};
      function stopHomeAudio() {
        const done = homeAudioDone;
        homeAudioDone = null;
        if (homeAudio) {
          try {
            homeAudio.onended = null;
            homeAudio.onerror = null;
            homeAudio.pause();
            homeAudio.src = "";
          } catch (e) {}
          homeAudio = null;
        }
        if (done) done();
        fetch("http://127.0.0.1:8731/api/stop", { cache: "no-store" }).catch(function () {});
      }

      function showView(name) {
        state.view = name;
        $("screenHome").classList.toggle("hidden", name !== "home");
        $("screenLesson").classList.toggle("hidden", name !== "lesson");
        $("screenDone").classList.toggle("hidden", name !== "done");
        if (name !== "home") {
          cancelHomeIntro();
          stopHomeAudio();
        }
        if (name !== "lesson" && V) V.stop();
      }

      function renderHome() {
        state.sessionId = Lesson.todaySessionId();
        const sess = Lesson.sessionMeta(state.sessionId);
        const u = unit();
        $("sessionEyebrow").textContent = "今天 · 自动安排";
        $("sessionTitle").textContent = sess.label.replace(/^工作日① |^工作日② /, "") || sess.label;
        $("sessionMeta").textContent = "约 " + sess.minutes + " 分钟 · Agent 提问与听写";
        $("unitLine").textContent = u.name + (u.lessonTitle ? " · " + u.lessonTitle : "");
        $("streakLine").innerHTML = "连续 <strong>" + streakDays() + "</strong> 天";
      }

      function startLesson() {
        const store = loadStore();
        state.cards = Lesson.buildCards(unit(), state.sessionId, store);
        state.index = 0;
        state.results = [];
        state.revealed = false;
        state.listenLocked = false;
        if (!state.cards.length) {
          alert("本单元暂无练习内容。");
          return;
        }
        showView("lesson");
        renderCard(true);
      }

      function progressPct() {
        if (!state.cards.length) return 0;
        return Math.round((state.index / state.cards.length) * 100);
      }

      function renderCard(autoSpeak) {
        const c = card();
        if (!c) {
          finishLesson();
          return;
        }
        state.revealed = false;
        state.listenLocked = false;
        state.sortAssign = {};
        state.sortActive = null;
        $("progressFill").style.width = progressPct() + "%";
        $("cardType").textContent = c.title || c.type;
        $("cardPrompt").textContent = c.prompt || "";
        $("cardSub").textContent = c.tip || c.sub || "";
        $("cardExtra").innerHTML = "";
        $("cardActions").innerHTML = "";

        if (c.type === "word") renderWordCard(c);
        else if (c.type === "listen") renderListenCard(c);
        else if (c.type === "pattern") renderPatternCard(c);
        else if (c.type === "oral") renderOralCard(c);
        else if (c.type === "dialogue") renderDialogueCard(c);
        else if (c.type === "sort") renderSortCard(c);
        else if (c.type === "write") renderWriteCard(c);
        else if (c.type === "read") renderReadCard(c);
        else renderOkBad(c);

        if (autoSpeak && c.autoPlay) {
          setTimeout(() => {
            if (V && V.isEnabled()) speakCard(c);
          }, 280);
        }
      }

      function setCoachTalking(on) {
        document.querySelectorAll(".coach-avatar").forEach((el) => {
          el.classList.toggle("is-talking", !!on);
          el.classList.toggle("is-idle", !on);
        });
      }

      function speakCard(c, rate) {
        if (!V || !c) return;
        setCoachTalking(true);
        const done = () => setTimeout(() => setCoachTalking(false), 200);
        const opts = rate && rate !== 1 ? { rate: rate } : undefined;
        let p;
        if (c.type === "dialogue" && c.lines) {
          p = V.speakSequence(c.lines.map((l) => ({ role: l.role, text: l.text, rate: opts && opts.rate })));
        } else if (c.type === "pattern" && c.demos && c.demos.length) {
          p = V.speakSequence(c.demos.map((d) => ({ role: "girlChild", text: d.text, rate: opts && opts.rate })));
        } else if (c.type === "write" && c.passage) {
          const parts = c.passage.split(/\n+/).map((s) => s.trim()).filter(Boolean);
          p = V.speakSequence(parts.map((text) => ({ role: c.narratorRole || "boyChild", text: text, rate: opts && opts.rate })));
        } else if (c.speakText) {
          p = V.speak(c.speakText, c.speakRole || "adultFemale", opts);
        }
        if (p && p.then) p.then(done).catch(done);
        else done();
      }

      function normalizeAnswer(s) {
        return String(s || "")
          .trim()
          .toLowerCase()
          .replace(/[’']/g, "'")
          .replace(/\s+/g, " ");
      }

      const LOTTIE = {
        turtle: "./assets/lottie/turtle.json?v=2",
        bee: "./assets/lottie/bee.json?v=2",
      };
      const PNG = {
        turtle: "./assets/turtle.png",
        bee: "./assets/bee.png",
      };
      const lottieAnims = {};

      function ensurePng(el, kind) {
        if (!el) return;
        let img = el.querySelector(".mascot-fallback, img");
        if (!img) {
          img = document.createElement("img");
          img.className = "mascot-fallback";
          img.alt = kind === "bee" ? "翻翻蜂" : "翻翻龟";
          el.appendChild(img);
        }
        img.src = PNG[kind] || PNG.turtle;
        img.style.display = "";
      }

      function mountLottie(el, kind, loop) {
        if (!el) return null;
        ensurePng(el, kind);
        if (!window.lottie) return null;
        if (location.protocol === "file:") return null;
        const host = document.createElement("div");
        host.className = "lottie-host";
        host.style.cssText = "position:absolute;inset:0;opacity:0;pointer-events:none;";
        el.appendChild(host);
        try {
          const anim = window.lottie.loadAnimation({
            container: host,
            renderer: "svg",
            loop: loop !== false,
            autoplay: true,
            path: LOTTIE[kind] || LOTTIE.turtle,
          });
          anim.addEventListener("DOMLoaded", () => {
            const fb = el.querySelector(".mascot-fallback, img.mascot-fallback");
            if (fb) fb.style.display = "none";
            host.style.opacity = "1";
            host.style.pointerEvents = "none";
          });
          anim.addEventListener("data_failed", () => {
            host.remove();
            ensurePng(el, kind);
          });
          return anim;
        } catch (e) {
          host.remove();
          ensurePng(el, kind);
          return null;
        }
      }

      function coachAvatar(kind) {
        const wrap = document.createElement("div");
        wrap.className = "coach-avatar coach-" + kind + " is-idle";
        const box = document.createElement("div");
        box.className = "coach-lottie";
        wrap.appendChild(box);
        ensurePng(box, kind);
        mountLottie(box, kind, true);
        return wrap;
      }

      function coachBanner(kind, title) {
        const row = document.createElement("div");
        row.className = "coach-banner";
        row.appendChild(coachAvatar(kind));
        const text = document.createElement("div");
        text.className = "coach-copy";
        const name = document.createElement("strong");
        name.textContent = kind === "bee" ? "翻翻蜂" : "翻翻龟";
        const tip = document.createElement("span");
        tip.textContent = title;
        text.appendChild(name);
        text.appendChild(tip);
        row.appendChild(text);
        return row;
      }

      function actionSpeak(label, fn, secondary) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "btn-speak" + (secondary ? " secondary" : "");
        b.textContent = label;
        b.addEventListener("click", fn);
        $("cardActions").appendChild(b);
      }
      function actionOkBad(onOk, onBad) {
        const row = document.createElement("div");
        row.className = "row2";
        const ok = document.createElement("button");
        ok.type = "button";
        ok.className = "btn-ok";
        ok.textContent = "会了";
        ok.addEventListener("click", onOk);
        const bad = document.createElement("button");
        bad.type = "button";
        bad.className = "btn-bad";
        bad.textContent = "不会";
        bad.addEventListener("click", onBad);
        row.appendChild(bad);
        row.appendChild(ok);
        $("cardActions").appendChild(row);
      }
      function renderOkBad(c) {
        actionSpeak("听 Agent", () => speakCard(c));
        actionOkBad(() => advance(true), () => advance(false));
      }

      function startFollowRead(c, onDone) {
        let count = 0;
        $("cardActions").innerHTML = "";
        const tip = document.createElement("p");
        tip.className = "follow-tip";
        tip.id = "followTip";
        tip.textContent = "跟「翻翻龟」读 3 遍，点一下跟读一遍";
        $("cardExtra").appendChild(tip);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "btn-ok";
        btn.textContent = "跟读（0 / 3）";
        btn.addEventListener("click", () => {
          if (!V) return;
          count += 1;
          btn.textContent = "跟读（" + count + " / 3）";
          V.speak(c.en, "boyChild");
          if (count >= 3) {
            btn.disabled = true;
            tip.textContent = "跟读完成，继续下一题";
            setTimeout(() => onDone(), 700);
          }
        });
        $("cardActions").appendChild(btn);
        if (V) V.speak(c.en, "boyChild");
      }

      function renderWordCard(c) {
        const isDictation = c.mode === "dictation";
        const extra = $("cardExtra");
        extra.innerHTML = "";
        $("cardActions").innerHTML = "";

        if (isDictation) {
          $("cardPrompt").textContent = "";
          $("cardSub").textContent = c.zh ? "中文意思：" + c.zh : "";
          extra.appendChild(coachBanner("turtle", "听「翻翻龟」读，写出英文"));
        } else {
          $("cardPrompt").textContent = c.zh || c.prompt || "";
          $("cardSub").textContent = "看中文，写出英文单词";
          extra.appendChild(coachBanner("turtle", "写出英文，点确定"));
        }

        const field = document.createElement("div");
        field.className = "dictation-box";
        field.innerHTML =
          '<input id="dictInput" class="dict-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="在这里输入英文" />';
        extra.appendChild(field);

        const confirm = document.createElement("button");
        confirm.type = "button";
        confirm.className = "btn-ok";
        confirm.id = "dictConfirm";
        confirm.textContent = "确定";
        confirm.addEventListener("click", () => {
          const input = $("dictInput");
          const typed = normalizeAnswer(input && input.value);
          const right = normalizeAnswer(c.en);
          if (!typed) {
            if (input) input.focus();
            return;
          }
          if (typed === right) {
            state.revealed = true;
            const peek = document.createElement("div");
            peek.className = "answer-peek ok";
            peek.textContent = "对了！ " + c.en;
            extra.appendChild(peek);
            confirm.disabled = true;
            if (input) input.disabled = true;
            if (V) V.speak(c.en, isDictation ? "boyChild" : "boyChild");
            setTimeout(() => advance(true, c), 800);
            return;
          }
          state.revealed = true;
          if (input) input.disabled = true;
          confirm.disabled = true;
          const peek = document.createElement("div");
          peek.className = "answer-peek";
          peek.textContent = "正确答案：" + c.en;
          extra.appendChild(peek);
          $("cardSub").textContent = "先听翻翻龟领读，再跟读 3 遍";
          $("cardActions").innerHTML = "";
          startFollowRead(c, () => advance(false, c));
        });
        $("cardActions").appendChild(confirm);

        if (isDictation) {
          actionSpeak("再听一遍", () => {
            if (V) V.speak(c.en, "boyChild");
          }, true);
        } else {
          actionSpeak("听发音", () => {
            if (V) V.speak(c.en, "boyChild");
          }, true);
        }

        const input = $("dictInput");
        if (input) {
          input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") confirm.click();
          });
          setTimeout(() => input.focus(), 120);
        }
      }

      function renderListenCard(c) {
        const extra = $("cardExtra");
        if (c.coach === "bee") {
          $("cardPrompt").textContent = c.prompt || "";
          $("cardSub").textContent = (c.tip ? c.tip + " · " : "") + "听「翻翻蜂」读完再选";
          extra.appendChild(coachBanner("bee", "听「翻翻蜂」读，再判断对错"));
        }
        const box = document.createElement("div");
        box.className = "choices";
        box.id = "listenChoices";
        (c.choices || []).forEach((ch) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "choice";
          b.textContent = ch.label;
          b.addEventListener("click", () => {
            if (state.listenLocked) return;
            state.listenLocked = true;
            const ok = String(ch.id) === String(c.answer);
            box.querySelectorAll(".choice").forEach((el) => {
              el.disabled = true;
            });
            b.classList.add(ok ? "correct" : "wrong");
            box.querySelectorAll(".choice").forEach((el, i) => {
              if (String(c.choices[i].id) === String(c.answer)) el.classList.add("correct");
            });
            if (c.tip) $("cardSub").textContent = (ok ? "对了。 " : "再听会更准。 ") + c.tip;
            setTimeout(() => advance(ok), 700);
          });
          box.appendChild(b);
        });
        extra.appendChild(box);
        actionSpeak(c.coach === "bee" ? "再听翻翻蜂" : "听 Agent", () => speakCard(c));
        if (c.kind === "judge" || c.coach === "bee") {
          actionSpeak("慢速 0.7×", () => speakCard(c, 0.7), true);
        }
      }

      function renderPatternCard(c) {
        $("cardExtra").appendChild(coachBanner("bee", "跟「翻翻蜂」读句型，再自己说一遍"));
        actionSpeak("再听翻翻蜂", () => speakCard(c));
        actionOkBad(() => advance(true), () => advance(false));
      }

      function renderOralCard(c) {
        actionSpeak("听提问", () => {
          if (V) V.speak(c.speakText, c.speakRole || "adultFemale");
        });
        if (c.sampleText) {
          actionSpeak("听示范答", () => {
            if (V) V.speak(c.sampleText, c.sampleRole || "boyChild");
          }, true);
        }
        actionOkBad(() => advance(true), () => advance(false));
      }

      function renderDialogueCard(c) {
        const list = document.createElement("div");
        list.className = "card-sub";
        list.style.whiteSpace = "pre-wrap";
        list.textContent = (c.lines || [])
          .map((l) => (l.name || "") + ": " + l.text)
          .join("\n");
        $("cardExtra").appendChild(list);
        actionSpeak("听对话", () => speakCard(c));
        actionOkBad(() => advance(true), () => advance(false));
      }

      function renderSortCard(c) {
        const wrap = document.createElement("div");
        wrap.className = "sort-wrap";
        const bank = document.createElement("div");
        bank.className = "sort-bank";
        bank.id = "sortBank";
        (c.bank || []).forEach((w) => {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "sort-chip";
          chip.textContent = w;
          chip.dataset.word = w;
          chip.addEventListener("click", () => {
            state.sortActive = w;
            bank.querySelectorAll(".sort-chip").forEach((el) => {
              el.classList.toggle("picked", el.dataset.word === w);
            });
          });
          bank.appendChild(chip);
        });
        const bins = document.createElement("div");
        bins.className = "sort-bins";
        (c.groups || []).forEach((g) => {
          const bin = document.createElement("div");
          bin.className = "sort-bin";
          bin.dataset.bin = g.id;
          bin.innerHTML = "<strong>" + g.label + "</strong><div class=\"bin-words\"></div>";
          bin.addEventListener("click", () => {
            if (!state.sortActive) return;
            state.sortAssign[state.sortActive] = g.id;
            state.sortActive = null;
            refreshSortUI(c, bank, bins);
          });
          bins.appendChild(bin);
        });
        wrap.appendChild(bank);
        wrap.appendChild(bins);
        $("cardExtra").appendChild(wrap);
        actionSpeak("听提示", () => {
          if (V) V.speak("Put the words into groups.", "adultFemale");
        });
        actionOkBad(
          () => {
            let ok = 0, total = 0;
            (c.groups || []).forEach((g) => {
              (g.answers || []).forEach((w) => {
                if ((c.bank || []).indexOf(w) < 0) return;
                total += 1;
                if (state.sortAssign[w] === g.id) ok += 1;
              });
            });
            advance(total ? ok >= Math.ceil(total * 0.6) : true);
          },
          () => advance(false)
        );
      }

      function refreshSortUI(c, bank, bins) {
        bank.querySelectorAll(".sort-chip").forEach((el) => {
          el.classList.toggle("used", !!state.sortAssign[el.dataset.word]);
          el.classList.remove("picked");
        });
        bins.querySelectorAll(".sort-bin").forEach((bin) => {
          const id = bin.dataset.bin;
          const words = Object.keys(state.sortAssign).filter((w) => state.sortAssign[w] === id);
          bin.querySelector(".bin-words").textContent = words.join(" · ");
        });
      }

      function renderWriteCard(c) {
        if (c.passage) {
          const p = document.createElement("div");
          p.className = "passage-mini";
          p.textContent = c.passage;
          $("cardExtra").appendChild(p);
        }
        const fields = document.createElement("div");
        fields.className = "write-fields";
        fields.innerHTML =
          '<label>仿写 1<input id="write1" maxlength="120" placeholder="I\'m happy when I …" /></label>' +
          '<label>仿写 2<input id="write2" maxlength="120" placeholder="I\'m happy when I …" /></label>';
        $("cardExtra").appendChild(fields);
        actionSpeak("听短文", () => speakCard(c));
        actionOkBad(
          () => {
            const t = (($("write1") && $("write1").value) || "") + " " + (($("write2") && $("write2").value) || "");
            const hasArticleBug = /go\s+to\s+park\b/i.test(t);
            if (hasArticleBug) $("cardSub").textContent = "提醒：go to a park / the park";
            saveStore({
              lastWrite: { w1: ($("write1") && $("write1").value) || "", w2: ($("write2") && $("write2").value) || "" },
            });
            advance(!hasArticleBug);
          },
          () => advance(false)
        );
      }

      function renderReadCard(c) {
        actionSpeak("听提问", () => speakCard(c));
        actionOkBad(() => advance(true), () => advance(false));
      }

      function pushRetry(c) {
        if (!c || !c.retryWord) return;
        const store = loadStore();
        let retry = store.retryWords || [];
        retry = retry.filter((r) => !(r.unitId === state.unitId && r.en === c.retryWord.en));
        retry.push({
          unitId: state.unitId,
          en: c.retryWord.en,
          zh: c.retryWord.zh,
          date: todayKey(),
        });
        saveStore({ retryWords: retry });
      }

      function advance(ok, c) {
        const cur = c || card();
        state.results.push(!!ok);
        if (!ok && cur && cur.retryWord) pushRetry(cur);
        if (V) V.stop();
        state.index += 1;
        if (state.index >= state.cards.length) finishLesson();
        else renderCard(true);
      }

      function finishLesson() {
        const ok = state.results.filter(Boolean).length;
        const total = state.results.length;
        const egg = Lesson.eggLine(unit());
        const logs = loadStore().logs || {};
        logs[todayKey()] = Object.assign({}, logs[todayKey()] || {}, {
          date: todayKey(),
          unitId: state.unitId,
          unitName: unit().name,
          session: state.sessionId,
          wordScore: ok + "/" + total,
          done: true,
        });
        saveStore({ logs: logs, unitId: state.unitId });
        $("doneScore").textContent = "做对 " + ok + " / " + total + " · " + (Lesson.sessionMeta(state.sessionId).label || "");
        $("doneEgg").textContent = "";
        $("btnHome").classList.add("hidden");
        $("progressFill").style.width = "100%";
        showView("done");
        startDonePractice(egg);
      }

      function scoreSpeech(heard, target) {
        const a = normalizeAnswer(heard);
        const b = normalizeAnswer(target);
        if (!a) return { ok: false, reason: "没听清，再说一次" };
        if (a === b) return { ok: true, reason: "说得很好！" };
        const aw = a.replace(/[^a-z'\s]/g, " ").split(/\s+/).filter(Boolean);
        const bw = b.replace(/[^a-z'\s]/g, " ").split(/\s+/).filter(Boolean);
        const setB = {};
        bw.forEach((w) => { setB[w] = true; });
        const hit = aw.filter((w) => setB[w]).length;
        const cover = bw.length ? hit / bw.length : 0;
        const patternOk = /\bi\s*(am|'m|feel)\b/.test(a) && /\b(because|when)\b/.test(a) && aw.length >= 5;
        if (cover >= 0.55 || (patternOk && cover >= 0.3)) {
          return { ok: true, reason: cover >= 0.55 ? "跟原句很像，真棒！" : "造句结构对了，很好！" };
        }
        return { ok: false, reason: "再试试：I'm … because / when …" };
      }

      function listenOnceEnglish() {
        return new Promise((resolve) => {
          const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (!SR) {
            resolve({ ok: false, text: "", error: "nosupport" });
            return;
          }
          const rec = new SR();
          rec.lang = (V && V.getAccent && V.getAccent() === "en-GB") ? "en-GB" : "en-US";
          rec.interimResults = false;
          rec.maxAlternatives = 3;
          let settled = false;
          const finish = (payload) => {
            if (settled) return;
            settled = true;
            try { rec.stop(); } catch (e) {}
            resolve(payload);
          };
          rec.onresult = (ev) => {
            let best = "";
            for (let i = 0; i < ev.results.length; i++) {
              const alt = ev.results[i][0];
              if (alt && alt.transcript) best = (best ? best + " " : "") + alt.transcript;
            }
            finish({ ok: true, text: best.trim(), error: null });
          };
          rec.onerror = () => finish({ ok: false, text: "", error: "error" });
          rec.onend = () => {
            if (!settled) finish({ ok: false, text: "", error: "empty" });
          };
          try {
            rec.start();
          } catch (e) {
            finish({ ok: false, text: "", error: "error" });
          }
        });
      }

      function startDonePractice(egg) {
        const box = $("donePractice");
        const home = $("btnHome");
        if (!box) return;
        box.innerHTML = "";
        home.classList.add("hidden");

        const sentence = document.createElement("div");
        sentence.className = "egg-line";
        sentence.textContent = egg;
        box.appendChild(sentence);

        const banner = coachBanner("turtle", "今日一句 · 翻翻龟领读");
        box.appendChild(banner);

        const tip = document.createElement("p");
        tip.className = "follow-tip";
        tip.textContent = "先听翻翻龟，再跟读 3 遍";
        box.appendChild(tip);

        const actions = document.createElement("div");
        actions.className = "done-actions";
        box.appendChild(actions);

        let follow = 0;
        const leadBtn = document.createElement("button");
        leadBtn.type = "button";
        leadBtn.className = "btn-speak";
        leadBtn.textContent = "听翻翻龟领读";
        const followBtn = document.createElement("button");
        followBtn.type = "button";
        followBtn.className = "btn-ok";
        followBtn.textContent = "跟读（0 / 3）";
        followBtn.disabled = true;

        function playLead() {
          if (V) V.speak(egg, "boyChild");
          followBtn.disabled = false;
          tip.textContent = "跟「翻翻龟」读 3 遍，点一下跟读一遍";
        }

        leadBtn.addEventListener("click", playLead);
        followBtn.addEventListener("click", () => {
          if (V) V.speak(egg, "boyChild");
          follow += 1;
          followBtn.textContent = "跟读（" + follow + " / 3）";
          if (follow >= 3) {
            followBtn.disabled = true;
            leadBtn.disabled = true;
            tip.textContent = "跟读完成！试着模仿造句，自己说一遍";
            startSayStep();
          }
        });
        actions.appendChild(leadBtn);
        actions.appendChild(followBtn);
        setTimeout(playLead, 200);

        function startSayStep() {
          actions.innerHTML = "";
          banner.replaceWith(coachBanner("bee", "翻翻蜂来听你造句"));
          const heard = document.createElement("p");
          heard.className = "heard-line";
          heard.textContent = "点下方按钮后开始说";
          box.appendChild(heard);

          const mic = document.createElement("button");
          mic.type = "button";
          mic.className = "btn-ok";
          mic.textContent = "点我说一句";
          actions.appendChild(mic);

          let busy = false;
          mic.addEventListener("click", () => {
            if (busy) return;
            busy = true;
            if (V) V.stop();
            mic.textContent = "正在听…请说英文";
            mic.disabled = true;
            tip.textContent = "模仿今日一句，用 I'm … because / when … 说一遍";
            listenOnceEnglish().then((res) => {
              busy = false;
              mic.disabled = false;
              mic.textContent = "再说一次";
              if (res.error === "nosupport") {
                heard.textContent = "这台浏览器不支持语音识别，请用 Chrome 打开";
                tip.textContent = "也可以先回首页，下次再用 Chrome";
                home.classList.remove("hidden");
                return;
              }
              if (!res.text) {
                heard.textContent = "没听清，再试一次";
                tip.textContent = "靠近麦克风，说完整一句";
                return;
              }
              heard.textContent = "你说了：" + res.text;
              const judge = scoreSpeech(res.text, egg);
              tip.textContent = judge.reason;
              tip.className = "follow-tip " + (judge.ok ? "ok" : "bad");
              if (judge.ok) {
                mic.disabled = true;
                mic.textContent = "过关啦";
                home.classList.remove("hidden");
                if (V) V.speak("Great job!", "girlChild");
              } else if (V) {
                V.speak("Try again.", "girlChild");
              }
            });
          });
        }
      }

      function openSettings(open) {
        $("settingsOverlay").classList.toggle("hidden", !open);
        $("settingsOverlay").setAttribute("aria-hidden", open ? "false" : "true");
      }

      function renderSettings() {
        $("unitSelect").innerHTML = DATA.units
          .map((u) => '<option value="' + u.id + '">' + u.name + "</option>")
          .join("");
        $("unitSelect").value = state.unitId;
        if (V) {
          const acc = V.getAccent();
          document.querySelectorAll("[data-accent]").forEach((el) => {
            el.classList.toggle("active", el.dataset.accent === acc);
          });
          const on = V.isEnabled();
          $("btnVoiceOn").classList.toggle("active", on);
          $("btnVoiceOff").classList.toggle("active", !on);
          $("castMap").innerHTML = V.castMap()
            .map((c) => "<div><strong>" + c.label + "</strong> · " + c.voice + "</div>")
            .join("");
        }
      }

      function init() {
        const store = loadStore();
        if (store.unitId && DATA.units.some((u) => u.id === store.unitId)) {
          state.unitId = store.unitId;
        }
        if (V) {
          if (store.accent === "en-GB" || store.accent === "en-US") V.setAccent(store.accent);
          V.setEnabled(store.voiceOn !== false);
        }
        $("btnStart").addEventListener("click", startLesson);
        $("btnHome").addEventListener("click", () => {
          showView("home");
          renderHome();
        });
        $("btnCloseLesson").addEventListener("click", () => {
          if (V) V.stop();
          if (confirm("结束今天的练习？进度不保存为完成。")) {
            showView("home");
            renderHome();
          }
        });
        $("btnMute").addEventListener("click", () => {
          if (!V) return;
          const on = !V.isEnabled();
          V.setEnabled(on);
          saveStore({ voiceOn: on });
          if (!on) V.stop();
          $("btnMute").textContent = on ? "♪" : "🔇";
        });
        $("btnSettings").addEventListener("click", () => {
          renderSettings();
          openSettings(true);
        });
        $("btnCloseSettings").addEventListener("click", () => openSettings(false));
        $("settingsOverlay").addEventListener("click", (e) => {
          if (e.target === $("settingsOverlay")) openSettings(false);
        });
        $("unitSelect").addEventListener("change", () => {
          state.unitId = $("unitSelect").value;
          saveStore({ unitId: state.unitId });
          renderHome();
        });
        document.querySelectorAll("[data-accent]").forEach((el) => {
          el.addEventListener("click", () => {
            if (!V) return;
            V.setAccent(el.dataset.accent);
            saveStore({ accent: el.dataset.accent });
            renderSettings();
          });
        });
        $("btnVoiceOn").addEventListener("click", () => {
          if (!V) return;
          V.setEnabled(true);
          saveStore({ voiceOn: true });
          renderSettings();
        });
        $("btnVoiceOff").addEventListener("click", () => {
          if (!V) return;
          V.setEnabled(false);
          V.stop();
          saveStore({ voiceOn: false });
          renderSettings();
        });
        $("btnVoicePreview").addEventListener("click", () => {
          if (!V) return;
          V.speakSequence([
            { role: "adultMale", text: "Hello. I am your English agent." },
            { role: "adultFemale", text: "Listen carefully. Please write the word." },
            { role: "boyChild", text: "I feel happy because I can play." },
            { role: "girlChild", text: "What's the matter? I can help you." },
          ]);
        });

        const turtle = document.querySelector(".mascot-turtle");
        const bee = document.querySelector(".mascot-bee");
        ensurePng(turtle, "turtle");
        ensurePng(bee, "bee");
        lottieAnims.turtle = mountLottie(turtle, "turtle", true);
        lottieAnims.bee = mountLottie(bee, "bee", true);
        const homeClips = {
          turtle: "./audio/home/turtle.mp3",
          bee: "./audio/home/bee.mp3",
        };
        const homeLines = {
          turtle: { role: "boyChild", text: "每天进步一点点，有一天比兔子跑得还远。" },
          bee: { role: "girlChild", text: "嗡嗡嗡，今天你也开口了吗？" },
        };
        let homeWho = "turtle";
        let introToken = 0;
        cancelHomeIntro = function () { introToken += 1; };
        function homeAlive(token) {
          return token === introToken && $("screenHome") && !$("screenHome").classList.contains("hidden");
        }
        function playHomeClip(who) {
          return new Promise((resolve) => {
            if (!V || !V.isEnabled()) { resolve(); return; }
            if (!$("screenHome") || $("screenHome").classList.contains("hidden")) { resolve(); return; }
            let settled = false;
            const finish = () => {
              if (settled) return;
              settled = true;
              if (homeAudioDone === finish) homeAudioDone = null;
              resolve();
            };
            homeAudioDone = finish;
            fetch("http://127.0.0.1:8731/api/play?who=" + encodeURIComponent(who), { cache: "no-store" })
              .then((r) => {
                if (!r.ok) throw new Error("speaker");
                finish();
              })
              .catch(() => {
                if (settled) return;
                const src = homeClips[who];
                if (!src) { finish(); return; }
                const a = new Audio(src + "?v=1");
                homeAudio = a;
                a.onended = finish;
                a.onerror = finish;
                const started = a.play();
                if (started && started.catch) started.catch(finish);
              });
          });
        }
        function setHomeLine(who) {
          const line = homeLines[who];
          const lineEl = $("mascotLine");
          if (lineEl && line) lineEl.textContent = line.text;
        }
        function spinTurtleIntoBee() {
          turtle.classList.add("is-on");
          bee.classList.remove("is-on");
          turtle.style.transformOrigin = "50% 50%";
          bee.style.transformOrigin = "50% 50%";
          turtle.style.zIndex = "3";
          bee.style.zIndex = "2";
          bee.style.opacity = "0";
          const spin = { duration: 880, easing: "cubic-bezier(0.45, 0, 0.2, 1)", fill: "forwards" };
          const leave = turtle.animate([
            { transform: "rotate(0deg) scale(1)", opacity: 1 },
            { transform: "rotate(160deg) scaleX(0.08) scaleY(1.06)", opacity: 1, offset: 0.46 },
            { transform: "rotate(200deg) scale(0.2)", opacity: 0, offset: 0.58 },
            { transform: "rotate(360deg) scale(1)", opacity: 0 },
          ], spin);
          const enter = bee.animate([
            { transform: "rotate(0deg) scaleX(0.08)", opacity: 0 },
            { transform: "rotate(160deg) scaleX(0.08) scaleY(1.06)", opacity: 0, offset: 0.46 },
            { transform: "rotate(210deg) scale(0.92)", opacity: 1, offset: 0.64 },
            { transform: "rotate(360deg) scale(1.06)", opacity: 1, offset: 0.9 },
            { transform: "rotate(360deg) scale(1)", opacity: 1 },
          ], spin);
          document.querySelectorAll(".spark").forEach((dot, i) => {
            dot.animate(
              [
                { transform: "scale(0.2)", opacity: 0 },
                { transform: "scale(1.3)", opacity: 1, offset: 0.4 },
                { transform: "scale(0.4)", opacity: 0 },
              ],
              { duration: 520, delay: 420 + i * 50, easing: "ease-out", fill: "forwards" }
            );
          });
          return Promise.all([leave.finished, enter.finished]).then(() => {
            turtle.classList.remove("is-on");
            bee.classList.add("is-on");
            setHomeLine("bee");
            return bee.animate([
              { transform: "rotate(0deg) scale(1.06)" },
              { transform: "rotate(-5deg) scale(0.97)", offset: 0.45 },
              { transform: "rotate(0deg) scale(1)" },
            ], { duration: 320, easing: "ease-out", fill: "forwards" }).finished;
          }).then(() => {
            turtle.getAnimations().forEach((a) => a.cancel());
            bee.getAnimations().forEach((a) => a.cancel());
            turtle.style.opacity = "";
            turtle.style.zIndex = "";
            turtle.style.transform = "";
            bee.style.opacity = "";
            bee.style.zIndex = "";
            bee.style.transform = "";
          });
        }
        function runHomeIntro() {
          const token = ++introToken;
          homeWho = "turtle";
          setHomeLine("turtle");
          playHomeClip("turtle").then(() => {
            if (!homeAlive(token)) return;
            return spinTurtleIntoBee();
          }).then(() => {
            if (!homeAlive(token)) return;
            homeWho = "bee";
            return playHomeClip("bee");
          }).catch(() => {});
        }
        if (turtle && bee) setTimeout(runHomeIntro, 80);

        renderHome();
        showView("home");
        if (V) setTimeout(renderSettings, 400);
      }

      init();
    })();
  </script>
</body>
