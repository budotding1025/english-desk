<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>翻翻英语</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./theme-duo.css?v=24" />
  <script src="./assets/vendor/lottie.min.js"></script>
</head>
<body>
  <div class="coin-toast hidden" id="coinToast" aria-live="polite">
    <span class="coin-toast-icon" aria-hidden="true"><img class="mark" src="./assets/icons/coin.svg" alt="" /></span>
    <span id="coinToastText">+10</span>
  </div>

  <div class="screen" id="screenHome">
    <div class="top">
      <div class="brand">翻翻英语</div>
      <div class="top-wallet">
        <span class="wallet-pill coin" id="homeCoins" title="金币"><img class="mark" src="./assets/icons/coin.svg" alt="" /><b>0</b></span>
        <span class="wallet-pill gem" id="homeGems" title="宝石"><img class="mark" src="./assets/icons/gem.svg" alt="" /><b>0</b></span>
        <button type="button" class="icon-btn" id="btnSettings" aria-label="设置">⚙</button>
      </div>
    </div>
    <div class="home-main">
      <div class="mascot-stage">
        <div class="mascot-wrap" aria-label="翻翻英语：乌龟坚持，蜜蜂开口">
          <div class="mascot mascot-turtle is-on" id="lottieTurtle" role="img" aria-label="翻翻龟">
            <img class="mascot-fallback" src="./assets/turtle.png" alt="翻翻龟" width="148" height="148" />
          </div>
          <div class="mascot mascot-bee" id="lottieBee" role="img" aria-label="翻翻蜂">
            <img class="mascot-fallback" src="./assets/bee.png" alt="翻翻蜂" width="148" height="148" />
          </div>
          <i class="spark s1"></i>
          <i class="spark s2"></i>
          <i class="spark s3"></i>
        </div>
      </div>
      <p class="mascot-line" id="mascotLine">每天进步一点点，有一天比兔子跑得还远。</p>
      <p class="streak" id="streakLine">连续 <strong>0</strong> 天</p>
      <p class="rank-line" id="rankLine">Sprout · 新芽</p>
      <div class="today-card">
        <p class="eyebrow" id="sessionEyebrow">Unit One Share and Care</p>
        <h1 id="sessionTitle">How Do You Feel Today?</h1>
        <p class="meta" id="sessionMeta">约 18 分钟 · Agent 带练</p>
        <button type="button" class="btn-start" id="btnStart">开始</button>
        <button type="button" class="btn-path" id="btnOpenPath">看学期路径</button>
      </div>
      <p class="unit-line" id="unitLine">Unit 1</p>
      <p class="path-summary" id="pathSummary">本学期 0 / 0 课</p>
    </div>
  </div>

  <!-- PATH -->
  <div class="screen hidden" id="screenPath">
    <div class="path-top">
      <button type="button" class="icon-btn" id="btnClosePath" aria-label="关闭">×</button>
      <h1>学期学习路径</h1>
      <div class="wallet-pill coin" id="pathCoins"><img class="mark" src="./assets/icons/coin.svg" alt="" /><b>0</b></div>
    </div>
    <p class="path-meta" id="pathMeta">本学期共 0 课 · 已学 0 课</p>
    <div class="path-scroll" id="pathList"></div>
    <div class="path-footer">
      <button type="button" class="btn-start" id="btnPathStart">开始下一课</button>
    </div>
  </div>

  <!-- RECORDS -->
  <div class="screen hidden" id="screenRecords">
    <div class="path-top">
      <button type="button" class="icon-btn" id="btnCloseRecords" aria-label="关闭">×</button>
      <h1>Records</h1>
      <div class="wallet-pill gem" id="recordsGems"><img class="mark" src="./assets/icons/gem.svg" alt="" /><b>0</b></div>
    </div>
    <div class="records-score" id="recordsScore"></div>
    <div class="records-actions" id="recordsActions"></div>
    <div id="rankPanel"></div>
    <div id="shopPanel"></div>
    <p class="path-meta" id="recordsMeta">错题本</p>
    <div class="path-scroll" id="recordsList"></div>
    <div class="path-footer">
      <button type="button" class="btn-start" id="btnRecordsToPath">去学期路径</button>
    </div>
  </div>

  <!-- LESSON -->
  <div class="screen hidden" id="screenLesson">
    <div class="lesson-top">
      <button type="button" class="home-nav-btn" id="btnCloseLesson" aria-label="Home">Home</button>
      <div class="progress" aria-hidden="true"><i id="progressFill"></i></div>
      <div class="lesson-wallet">
        <span class="wallet-pill coin sm" id="lessonCoinsHud"><img class="mark" src="./assets/icons/coin.svg" alt="" /><b>+0</b></span>
        <button type="button" class="icon-btn" id="btnMute" aria-label="静音" title="语音开闭">♪</button>
      </div>
    </div>
    <div class="lesson-head" id="lessonHead">
      <p class="lesson-unit" id="lessonUnitTitle">Unit</p>
      <p class="lesson-name" id="lessonNameTitle">Lesson</p>
      <p class="lesson-focus" id="lessonFocus"></p>
      <div class="challenge-clock hidden" id="challengeClock">
        <span class="challenge-time" id="challengeTime">0:00</span>
        <button type="button" class="btn-gem-time" id="btnGemTime">1 宝石 +30 秒</button>
      </div>
    </div>
    <div class="lesson-body">
      <p class="card-type" id="cardType">词</p>
      <p class="card-prompt" id="cardPrompt">—</p>
      <p class="card-sub" id="cardSub"></p>
      <div id="cardExtra"></div>
      <div class="lesson-actions" id="cardActions"></div>
    </div>
  </div>

  <!-- DONE -->
  <div class="screen hidden" id="screenDone">
    <div class="done-main">
      <div id="doneSummary" class="done-summary"></div>
      <div id="donePracticeWrap" class="hidden">
        <h1>今日一句</h1>
        <p class="meta" id="doneScore" style="color:var(--muted)">—</p>
        <div class="egg" id="doneEgg"></div>
        <div id="donePractice" class="done-practice"></div>
      </div>
      <div class="done-actions-bar" id="doneActionsBar"></div>
      <button type="button" class="btn-start hidden" id="btnHome">回首页</button>
    </div>
  </div>

  <!-- SETTINGS -->
  <div class="overlay hidden" id="settingsOverlay" aria-hidden="true">
    <div class="sheet" role="dialog" aria-labelledby="settingsTitle">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h2 id="settingsTitle">设置</h2>
        <button type="button" class="icon-btn" id="btnCloseSettings" aria-label="关闭">×</button>
      </div>
      <label for="unitSelect">单元</label>
      <select id="unitSelect"></select>
      <label>口音</label>
      <div class="row">
        <button type="button" class="chip active" data-accent="en-US">美式</button>
        <button type="button" class="chip" data-accent="en-GB">英式</button>
      </div>
      <label>语音</label>
      <div class="row">
        <button type="button" class="chip active" id="btnVoiceOn">开</button>
        <button type="button" class="chip" id="btnVoiceOff">关</button>
        <button type="button" class="chip" id="btnVoicePreview">试听四角色</button>
      </div>
      <div class="cast-mini" id="castMap"></div>
    </div>
  </div>

  <nav class="app-nav" id="appNav" aria-label="主导航">
    <button type="button" class="nav-item is-on" data-nav="home" id="navHome" aria-label="首页">
      <span class="nav-lottie" id="navHomeLottie" aria-hidden="true"></span>
      <span class="nav-label">Home</span>
    </button>
    <button type="button" class="nav-item" data-nav="path" id="navPath" aria-label="Path">
      <span class="nav-glyph" style="-webkit-mask-image:url('./assets/icons/map-pin-line.png');mask-image:url('./assets/icons/map-pin-line.png')" aria-hidden="true"></span>
      <span class="nav-label">Path</span>
    </button>
    <button type="button" class="nav-item" data-nav="records" id="navRecords" aria-label="Records">
      <span class="nav-glyph" style="-webkit-mask-image:url('./assets/icons/book-open-line.png');mask-image:url('./assets/icons/book-open-line.png')" aria-hidden="true"></span>
      <span class="nav-label">Records</span>
    </button>
  </nav>

  <script src="./data.js?v=12"></script>
  <script src="./progress.js?v=8"></script>
  <script src="./voice.js?v=7"></script>
  <script>
    (function () {
      const DATA = window.ENGLISH_DESK_DATA;
      const Lesson = window.EnglishDeskLesson;
      const Progress = window.EnglishDeskProgress;
      const V = window.EnglishVoice;
      const STORE_KEY = "english-desk-v3";

      const $ = (id) => document.getElementById(id);
      const state = {
        view: "home",
        unitId: "u1",
        sessionId: "weekdayListen",
        pathId: "u1-L1",
        cards: [],
        index: 0,
        results: [],
        revealed: false,
        listenLocked: false,
        sortAssign: {},
        sortActive: null,
        lessonCoins: 0,
        correctInLesson: 0,
        lastSettle: null,
        lessonMode: "normal",
      };

      function loadStore() {
        try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); }
        catch (e) { return {}; }
      }
      function saveStore(partial) {
        const next = Object.assign({}, loadStore(), partial);
        localStorage.setItem(STORE_KEY, JSON.stringify(next));
        return next;
      }
      function todayKey() {
        return new Date().toISOString().slice(0, 10);
      }
      function unit() {
        return DATA.units.find((u) => u.id === state.unitId) || DATA.units[0];
      }
      function card() {
        return state.cards[state.index] || null;
      }

      function streakDays() {
        const logs = loadStore().logs || {};
        const keys = Object.keys(logs).filter((k) => logs[k] && logs[k].done).sort().reverse();
        if (!keys.length) return 0;
        let n = 0;
        const d = new Date();
        for (;;) {
          const key = d.toISOString().slice(0, 10);
          if (logs[key] && logs[key].done) {
            n += 1;
            d.setDate(d.getDate() - 1);
          } else if (n === 0 && key === todayKey()) {
            d.setDate(d.getDate() - 1);
          } else break;
        }
        return n;
      }

      let homeAudio = null;
      let homeAudioDone = null;
      let cancelHomeIntro = function () {};
      let startHomeMascotLoop = function () {};
      const homeSloganSaid = { turtle: false, bee: false };
      let fxAudio = null;
      let fxToken = 0;
      function pauseFx() {
        if (!fxAudio) return;
        try {
          fxAudio.onended = null;
          fxAudio.pause();
          fxAudio.src = "";
        } catch (e) {}
        fxAudio = null;
      }
      function stopFx() {
        fxToken += 1;
        pauseFx();
      }
      function playFx(name, seconds) {
        if (V && !V.isEnabled()) return;
        stopFx();
        const token = fxToken;
        const a = new Audio("./audio/fx/" + name + ".wav?v=1");
        fxAudio = a;
        a.volume = 0.9;
        const started = a.play();
        if (started && started.catch) started.catch(function () {});
        setTimeout(function () {
          if (token !== fxToken || fxAudio !== a) return;
          pauseFx();
        }, Math.round(seconds * 1000));
      }
      function stopHomeAudio() {
        const done = homeAudioDone;
        homeAudioDone = null;
        if (homeAudio) {
          try {
            homeAudio.onended = null;
            homeAudio.onerror = null;
            homeAudio.pause();
            homeAudio.src = "";
          } catch (e) {}
          homeAudio = null;
        }
        if (done) done();
        fetch("http://127.0.0.1:8731/api/stop", { cache: "no-store" }).catch(function () {});
      }

      function showView(name) {
        state.view = name;
        $("screenHome").classList.toggle("hidden", name !== "home");
        $("screenLesson").classList.toggle("hidden", name !== "lesson");
        $("screenDone").classList.toggle("hidden", name !== "done");
        if ($("screenPath")) $("screenPath").classList.toggle("hidden", name !== "path");
        if ($("screenRecords")) $("screenRecords").classList.toggle("hidden", name !== "records");
        const showNav = name === "home" || name === "path" || name === "records";
        if ($("appNav")) $("appNav").classList.toggle("hidden", !showNav);
        syncNav(name === "path" || name === "home" || name === "records" ? name : null);
        stopFx();
        stopMascotLine();
        if (name !== "home") {
          cancelHomeIntro();
          stopHomeAudio();
        } else {
          startHomeMascotLoop();
          playNavHome();
        }
        if (name !== "lesson") stopChallengeTimer();
        if (name !== "lesson" && V) V.stop();
      }

      let navHomeAnim = null;
      function mountNavHome() {
        const host = $("navHomeLottie");
        if (!host || navHomeAnim) return;
        if (!window.lottie || location.protocol === "file:") {
          host.textContent = "🏠";
          host.classList.add("nav-fallback");
          return;
        }
        try {
          navHomeAnim = window.lottie.loadAnimation({
            container: host,
            renderer: "svg",
            loop: true,
            autoplay: true,
            path: "./assets/lottie/home-in-out.json?v=2",
          });
          navHomeAnim.addEventListener("DOMLoaded", () => {
            try { navHomeAnim.play(); } catch (e) {}
          });
          navHomeAnim.addEventListener("data_failed", () => {
            host.textContent = "🏠";
            host.classList.add("nav-fallback");
            navHomeAnim = null;
          });
        } catch (e) {
          host.textContent = "🏠";
          host.classList.add("nav-fallback");
        }
      }
      function playNavHome() {
        if (!navHomeAnim) {
          mountNavHome();
        }
        if (!navHomeAnim) return;
        try {
          if (navHomeAnim.isPaused) navHomeAnim.play();
          else {
            navHomeAnim.goToAndPlay(0, true);
          }
        } catch (e) {}
      }
      function syncNav(active) {
        document.querySelectorAll(".nav-item").forEach((el) => {
          el.classList.toggle("is-on", !!active && el.dataset.nav === active);
        });
      }

      function walletStore() {
        return Progress.ensureProgress(loadStore());
      }

      function syncWalletUI() {
        const s = walletStore();
        function setCount(id, text) {
          const el = $(id);
          if (!el) return;
          const b = el.querySelector("b");
          if (b) b.textContent = text;
        }
        setCount("homeCoins", String(s.coins));
        setCount("homeGems", String(s.gems));
        setCount("pathCoins", String(s.coins));
        setCount("recordsGems", String(s.gems));
        setCount("lessonCoinsHud", "+" + (state.lessonCoins || 0));
        const rank = Progress.currentRank(s);
        const nxt = Progress.nextRank(s);
        if ($("rankLine")) {
          $("rankLine").textContent = nxt
            ? rank.en + " · " + rank.zh + "  ·  下一级要 " + Progress.coinNeed(s, nxt) + " 金币、" + nxt.lessons + " 课"
            : rank.en + " · " + rank.zh;
        }
        const done = Progress.completedCount(s.completedLessons);
        const total = Progress.pathTotal();
        if ($("pathSummary")) {
          $("pathSummary").textContent = "本学期已学 " + done + " / " + total + " 课 · 多学/复习可拿附加金币";
        }
      }

      function persistWallet(store) {
        saveStore({
          coins: store.coins,
          gems: store.gems,
          rank: store.rank,
          gemCut: store.gemCut,
        });
      }

      let challengeTimer = null;
      function formatClock(sec) {
        sec = Math.max(0, sec | 0);
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return m + ":" + (s < 10 ? "0" : "") + s;
      }
      function paintChallengeClock() {
        const el = $("challengeTime");
        if (el) el.textContent = formatClock(state.challengeLeft || 0);
        const btn = $("btnGemTime");
        if (!btn) return;
        const gems = walletStore().gems;
        btn.disabled = gems < 1;
        btn.textContent = gems < 1 ? "没有宝石" : "1 宝石 +" + Progress.GEM_TIME + " 秒";
      }
      function stopChallengeTimer() {
        if (challengeTimer) {
          clearInterval(challengeTimer);
          challengeTimer = null;
        }
        const box = $("challengeClock");
        if (box) box.classList.add("hidden");
      }
      function startChallengeTimer(seconds) {
        stopChallengeTimer();
        state.challengeLeft = seconds;
        const box = $("challengeClock");
        if (box) box.classList.remove("hidden");
        paintChallengeClock();
        challengeTimer = setInterval(() => {
          state.challengeLeft -= 1;
          paintChallengeClock();
          if (state.challengeLeft <= 0) {
            stopChallengeTimer();
            finishLesson();
          }
        }, 1000);
      }

      function showCoinToast(amount) {
        const el = $("coinToast");
        if (!el) return;
        $("coinToastText").textContent = "+" + amount;
        el.classList.remove("hidden");
        el.classList.remove("pop");
        void el.offsetWidth;
        el.classList.add("pop");
        clearTimeout(showCoinToast._t);
        showCoinToast._t = setTimeout(() => {
          el.classList.add("hidden");
          el.classList.remove("pop");
        }, 900);
      }

      let mascotAudio = null;
      function stopMascotLine() {
        if (!mascotAudio) return;
        try {
          mascotAudio.onended = null;
          mascotAudio.onerror = null;
          mascotAudio.pause();
          mascotAudio.src = "";
        } catch (e) {}
        mascotAudio = null;
      }
      function playMascotLine(clip, role, text) {
        if (V && !V.isEnabled()) return;
        stopMascotLine();
        if (V) V.stop();
        const a = new Audio("./audio/cheer/" + clip + ".mp3?v=1");
        mascotAudio = a;
        let fell = false;
        const fallback = function () {
          if (fell) return;
          fell = true;
          if (mascotAudio === a) mascotAudio = null;
          if (V) V.speak(text, role);
        };
        a.onerror = fallback;
        const started = a.play();
        if (started && started.catch) started.catch(fallback);
      }
      function cueReward(fxName, fxSeconds, clip, role, text, voiceMs) {
        playFx(fxName, fxSeconds);
        const token = fxToken;
        state.praiseWait = 1000 + voiceMs;
        setTimeout(function () {
          if (token !== fxToken) return;
          if (state.view !== "lesson") return;
          playMascotLine(clip, role, text);
        }, 1000);
      }
      function onCorrectReward() {
        const gain = Progress.COIN_CORRECT;
        state.lessonCoins = (state.lessonCoins || 0) + gain;
        state.correctInLesson = (state.correctInLesson || 0) + 1;
        state.correctStreak = (state.correctStreak || 0) + 1;
        showCoinToast(gain);
        syncWalletUI();
        const n = state.correctStreak;
        if (n === 5) {
          cueReward("sparkle", 2.6, "streak5", "girlChild", "我说什么来着！你比你自己想象的要厉害得多！", 5200);
        } else if (n === 2) {
          cueReward("sparkle", 2.6, "streak2", "girlChild", "哇！你又答对了！厉害！", 3000);
        } else {
          cueReward("sparkle", 2.6, "ok", "girlChild", "赞！", 900);
        }
      }

      function onWrongReward() {
        state.correctStreak = 0;
        cueReward("bug", 0.8, "wrong", "boyChild", "没关系，错了就改。加油！下一次你一定行！", 5200);
      }

      function mountCoinsLottie(host, loop) {
        if (!host) return null;
        host.innerHTML = "";
        if (!window.lottie || location.protocol === "file:") {
          host.innerHTML = '<div class="coin-fallback">🪙🪙🪙</div>';
          return null;
        }
        try {
          return window.lottie.loadAnimation({
            container: host,
            renderer: "svg",
            loop: !!loop,
            autoplay: true,
            path: "./assets/lottie/coins.json?v=1",
          });
        } catch (e) {
          host.innerHTML = '<div class="coin-fallback">🪙🪙🪙</div>';
          return null;
        }
      }

      function renderHome() {
        state.sessionId = Lesson.todaySessionId();
        const store = walletStore();
        const node = Progress.nodeById(store.currentPathId) || Progress.semesterPath()[0];
        if (node) {
          state.pathId = node.id;
          state.unitId = node.unitId;
        }
        const sess = Lesson.sessionMeta("weekdayListen");
        const u = unit();
        const bookNo = node ? (node.bookLesson || node.lesson) : "";
        const unitTitle = (node && node.unitTitle) || (u && u.name) || "";
        const lessonTitle = (node && node.lessonTitle) || "";
        if ($("sessionEyebrow")) $("sessionEyebrow").textContent = unitTitle;
        if ($("sessionTitle")) $("sessionTitle").textContent = lessonTitle;
        if ($("sessionMeta")) {
          $("sessionMeta").textContent = (bookNo ? "Lesson " + bookNo + " · " : "") + "约 " + sess.minutes + " 分钟";
        }
        if ($("unitLine")) {
          $("unitLine").textContent = unitTitle + (lessonTitle ? " · " + lessonTitle : "");
        }
        $("streakLine").innerHTML = "连续 <strong>" + streakDays() + "</strong> 天";
        syncWalletUI();
      }

      function startLesson(pathId, opts) {
        opts = opts || {};
        const store = walletStore();
        state.lessonMode = opts.mode || "normal";
        if (pathId) state.pathId = pathId;
        else state.pathId = store.currentPathId || state.pathId;
        const node = Progress.nodeById(state.pathId);
        if (node) {
          state.unitId = node.unitId;
          if (state.lessonMode === "normal") {
            saveStore({ unitId: state.unitId, currentPathId: state.pathId });
          } else {
            saveStore({ unitId: state.unitId });
          }
        }
        const sessionId =
          state.lessonMode === "retry"
            ? "retry"
            : state.lessonMode === "challenge"
              ? "challenge"
              : "weekdayListen";
        const cardStore = Object.assign({}, store, { currentPathId: state.pathId });
        state.cards = Lesson.buildCards(unit(), sessionId, cardStore);
        state.sessionId = sessionId;
        state.index = 0;
        state.results = [];
        state.revealed = false;
        state.listenLocked = false;
        state.lessonCoins = 0;
        state.correctInLesson = 0;
        state.correctStreak = 0;
        state.praiseWait = 0;
        state.scored = false;
        state.lastSettle = null;
        stopChallengeTimer();
        if (!state.cards.length) {
          if (state.lessonMode === "retry") alert("暂时没有错题，先去上课积累几道吧。");
          else alert("本单元暂无练习内容。");
          return;
        }
        showView("lesson");
        syncWalletUI();
        if (state.lessonMode === "challenge") startChallengeTimer(Progress.challengeSeconds(state.cards.length));
        renderCard(true);
      }

      function renderPath() {

      function progressPct() {
        if (!state.cards.length) return 0;
        return Math.round((state.index / state.cards.length) * 100);

      function renderCard(autoSpeak) {
        const c = card();
        if (!c) {
          finishLesson();
          return;
        }
        state.revealed = false;
        state.listenLocked = false;
        state.scored = false;
        state.sortAssign = {};
        state.sortActive = null;
        $("progressFill").style.width = progressPct() + "%";
        $("cardType").textContent = c.title || c.type;
        $("cardPrompt").textContent = c.prompt || "";
        $("cardSub").textContent = c.tip || c.sub || "";
        $("cardExtra").innerHTML = "";
        $("cardActions").innerHTML = "";
        paintLessonHead();

        if (c.type === "word") renderWordCard(c);
        else if (c.type === "listen") renderListenCard(c);
        else if (c.type === "pattern") renderPatternCard(c);
        else if (c.type === "oral") renderOralCard(c);
        else if (c.type === "dialogue") renderDialogueCard(c);
        else if (c.type === "sort") renderSortCard(c);
        else if (c.type === "write") renderWriteCard(c);
        else if (c.type === "read") renderReadCard(c);
        else renderOkBad(c);

        if (autoSpeak && c.autoPlay) {
          setTimeout(() => {
            if (V && V.isEnabled()) speakCard(c, state.slowOn ? 0.5 : undefined);
          }, 280);
        }
        maybeSkipButton();
      }

      function setCoachTalking(on) {
        document.querySelectorAll(".coach-avatar").forEach((el) => {
          el.classList.toggle("is-talking", !!on);
          el.classList.toggle("is-idle", !on);
        });
      }

      function speakCard(c, rate) {
        if (!V || !c) return;
        setCoachTalking(true);
        const done = () => setTimeout(() => setCoachTalking(false), 200);
        const opts = rate && rate !== 1 ? { rate: rate } : (state.slowOn ? { rate: 0.5 } : undefined);
        let p;
        if (c.type === "dialogue" && c.lines) {
          p = V.speakSequence(c.lines.map((l) => ({ role: l.role, text: l.text, rate: opts && opts.rate })));
        } else if (c.type === "pattern" && c.demos && c.demos.length) {
          p = V.speakSequence(
            c.demos.map((d) => ({
              role: d.role || c.speakRole || "girlChild",
              text: d.text,
              rate: opts && opts.rate,
            }))
          );
        } else if (c.type === "write" && c.passage) {
          const parts = c.passage.split(/\n+/).map((s) => s.trim()).filter(Boolean);
          p = V.speakSequence(parts.map((text) => ({ role: c.narratorRole || "boyChild", text: text, rate: opts && opts.rate })));
        } else if (c.speakText) {
          p = V.speak(c.speakText, c.speakRole || "adultFemale", opts);
        }
        if (p && p.then) p.then(done).catch(done);
        else done();
      }

      function normalizeAnswer(s) {
        return String(s || "")
          .trim()
          .toLowerCase()
          .replace(/[’']/g, "'")
          .replace(/\s+/g, " ");
      }

      const LOTTIE = {
        turtle: "./assets/lottie/turtle.json?v=2",
        bee: "./assets/lottie/bee.json?v=2",
      };
      const PNG = {
        turtle: "./assets/turtle.png",
        bee: "./assets/bee.png",
      };
      const lottieAnims = {};

      function ensurePng(el, kind) {
        if (!el) return;
        let img = el.querySelector(".mascot-fallback, img");
        if (!img) {
          img = document.createElement("img");
          img.className = "mascot-fallback";
          img.alt = kind === "bee" ? "翻翻蜂" : "翻翻龟";
          el.appendChild(img);
        }
        img.src = PNG[kind] || PNG.turtle;
        img.style.display = "";
      }

      function mountLottie(el, kind, loop) {
        if (!el) return null;
        ensurePng(el, kind);
        if (!window.lottie) return null;
        if (location.protocol === "file:") return null;
        const host = document.createElement("div");
        host.className = "lottie-host";
        host.style.cssText = "position:absolute;inset:0;opacity:0;pointer-events:none;";
        el.appendChild(host);
        try {
          const anim = window.lottie.loadAnimation({
            container: host,
            renderer: "svg",
            loop: loop !== false,
            autoplay: true,
            path: LOTTIE[kind] || LOTTIE.turtle,
          });
          anim.addEventListener("DOMLoaded", () => {
            const fb = el.querySelector(".mascot-fallback, img.mascot-fallback");
            if (fb) fb.style.display = "none";
            host.style.opacity = "1";
            host.style.pointerEvents = "none";
          });
          anim.addEventListener("data_failed", () => {
            host.remove();
            ensurePng(el, kind);
          });
          return anim;
        } catch (e) {
          host.remove();
          ensurePng(el, kind);
          return null;
        }
      }

      function coachAvatar(kind) {
        const wrap = document.createElement("div");
        wrap.className = "coach-avatar coach-" + kind + " is-idle";

        wrap.appendChild(box);
        ensurePng(box, kind);
        mountLottie(box, kind, true);
        return wrap;

      function wordSpeak(c, rate) {
        if (!V || !c) return;
        const text = String(c.en || c.speakText || "").trim();
        if (!text || text === "null" || text === "undefined") return;
        const role = c.speakRole || (c.mode === "dictation" ? "boyChild" : "adultMale");
        V.speak(text, role, rate && rate !== 1 ? { rate: rate } : undefined);
      }

      function startFollowRead(c, onDone, opts) {
        opts = opts || {};
        const manual = !!opts.manualDone;
        let count = 0;
        $("cardActions").innerHTML = "";
        const tip = document.createElement("p");

          }

      function fillHighlight(el, text, key) {
        const raw = String(text || "");
        const focus = String(key || "").trim();
        const at = focus ? raw.toLowerCase().indexOf(focus.toLowerCase()) : -1;
        el.textContent = "";
        if (at < 0) {
          el.textContent = raw;
          return;
        }
        el.appendChild(document.createTextNode(raw.slice(0, at)));
        const mark = document.createElement("mark");
        mark.textContent = raw.slice(at, at + focus.length);
        el.appendChild(mark);
        el.appendChild(document.createTextNode(raw.slice(at + focus.length)));
      }

      function listenFocus(c) {
        const choice = (c.choices || []).filter((ch) => String(ch.id) === String(c.answer))[0];
        const answerEn = c.kind === "reply" && choice ? choice.label : "";
        const tipEn = String(c.tip || "").match(/[A-Za-z][A-Za-z'’ .,!?]*/);
        let key = tipEn ? tipEn[0].trim().replace(/[.?!,\s]+$/, "") : "";
        if (!key) key = answerEn;
        return {
          original: c.speakText || "",
          key: key,
          answerEn: answerEn,
          zh: c.zh || "",
          answerZh: c.answerZh || "",
        };
      }

      function replayListenFocus(c, focus) {
        if (!V) return;
        const role = c.speakRole || "girlChild";
        const again = V.speak(focus.original, role);
        if (again && again.then && focus.answerEn && focus.answerEn !== focus.original) {
          again.then(() => V.speak(focus.answerEn, "girlChild"));
        }
      }

      function renderWordCard(c) {
        const isDictation = c.mode === "dictation";
        const extra = $("cardExtra");
        extra.innerHTML = "";
        $("cardActions").innerHTML = "";

        if (isDictation) {
          $("cardPrompt").textContent = "";
          $("cardSub").textContent = c.zh ? "中文意思：" + c.zh : "";
          extra.appendChild(coachBanner("turtle", "听「翻翻龟」读，写出英文"));
        } else {
          $("cardPrompt").textContent = c.zh || c.prompt || "";
          $("cardSub").textContent = "看中文，在下方输入英文";
          extra.appendChild(coachBanner("turtle", "写出英文，点确定"));
        }

        const field = document.createElement("div");
        field.className = "dictation-box";
        const inputEl = document.createElement("input");
        inputEl.id = "dictInput";
        inputEl.className = "dict-input";
        inputEl.type = "text";
        inputEl.value = "";
        inputEl.autocomplete = "off";
        inputEl.setAttribute("autocapitalize", "off");
        inputEl.setAttribute("autocorrect", "off");
        inputEl.spellcheck = false;
        inputEl.placeholder = "在这里输入英文";
        field.appendChild(inputEl);
        extra.appendChild(field);

        const confirm = document.createElement("button");
        confirm.type = "button";
        confirm.className = "btn-ok";
        confirm.id = "dictConfirm";
        confirm.textContent = "确定";
        confirm.addEventListener("click", () => {
          const input = $("dictInput");
          const typed = normalizeAnswer(input && input.value);
          const right = normalizeAnswer(c.en);
          if (!typed) {
            if (input) input.focus();
            return;
          }
          const ok = typed === right;
          state.revealed = true;
          confirm.disabled = true;
          if (input) input.disabled = true;
          const peek = document.createElement("div");
          peek.className = "answer-peek" + (ok ? " ok" : "");
          peek.textContent = (ok ? "对了！ " : "正确答案：") + c.en;
          extra.appendChild(peek);
          $("cardSub").textContent = "先听鼓励，再听正确读音，大声跟读 3 遍";
          $("cardActions").innerHTML = "";
          const wait = scoreAnswer(ok, c);
          state.praiseWait = 0;

      function pushRetry(c) {
        if (!c || !c.retryWord) return;
        const store = loadStore();
        let retry = store.retryWords || [];
        retry = retry.filter((r) => !(r.unitId === state.unitId && r.en === c.retryWord.en));
        retry.push({
          unitId: state.unitId,
          en: c.retryWord.en,
          zh: c.retryWord.zh,
          date: todayKey(),
        });
        saveStore({ retryWords: retry });
      }

      function clearRetry(c) {
        if (!c || !c.retryWord) return;
        const store = loadStore();
        const retry = (store.retryWords || []).filter(
          (r) => !(r.unitId === state.unitId && r.en === c.retryWord.en)
        );
        saveStore({ retryWords: retry });
      }

      function scoreAnswer(ok, c) {
        if (state.scored) return state.praiseWait || 0;
        state.scored = true;
        const cur = c || card();
        state.results.push(!!ok);
        const tracked = Progress.recordAnswer(walletStore(), !!ok);
        saveStore({ stats: tracked.stats });
        if (!ok && cur && cur.retryWord) pushRetry(cur);
        if (ok && cur && cur.retryWord) clearRetry(cur);
        if (ok) onCorrectReward();
        else onWrongReward();
        return state.praiseWait || (ok ? 900 : 1200);
      }

      function advance(ok, c) {
        if (!state.scored) scoreAnswer(ok, c);
        state.scored = false;
        state.index += 1;
        const delay = state.praiseWait || 400;
        state.praiseWait = 0;
        setTimeout(() => {
          if (state.index >= state.cards.length) finishLesson();
          else renderCard(true);
        }, delay);
      }

      function finishLesson() {
        const ok = state.results.filter(Boolean).length;
        const total = state.results.length;
        const egg = Lesson.eggLine(unit());
        const store0 = walletStore();
        const lessonCoins = state.lessonCoins || 0;
        const settle =
          state.lessonMode === "retry" || state.lessonMode === "challenge"
            ? Progress.settlePractice(store0, lessonCoins, todayKey(), state.lessonMode)
            : Progress.settleLesson(
                store0,
                state.pathId || store0.currentPathId,
                lessonCoins,
                todayKey()
              );
        if (state.doubleOn) {
          settle.store.coins += settle.earned;
          settle.earned *= 2;
          settle.lessonCoins *= 2;
          settle.bonus *= 2;
          if (settle.rankBonus) settle.rankBonus *= 2;
          settle.totalCoins = settle.store.coins;
          settle.double = true;
          state.doubleOn = false;
        }
        state.lastSettle = settle;
        const logs = settle.store.logs || loadStore().logs || {};
        logs[todayKey()] = Object.assign({}, logs[todayKey()] || {}, {
          date: todayKey(),
          unitId: state.unitId,
          unitName: unit().name,
          pathId: settle.pathId,
          session: state.sessionId,
          wordScore: ok + "/" + total,
          lessonCoins: settle.earned,
          mode: state.lessonMode || "normal",
          done: true,
        });
        settle.store.logs = logs;
        settle.store.unitId = state.unitId;
        localStorage.setItem(STORE_KEY, JSON.stringify(settle.store));
        $("progressFill").style.width = "100%";
        showView("done");
        renderDoneSummary(settle, ok, total, egg);
      }

                : "看学期路径",
          "btn-start",
          () => {
            if (settle.practiceKind === "challenge") startLesson(null, { mode: "challenge" });
            else if (settle.practiceKind === "retry") startLesson(null, { mode: "retry" });
            else if (settle.next) startLesson(settle.next.id);
            else {
              showView("path");
              renderPath();
            }
          }
        );
        addBtn(settle.practiceKind ? "看 Records" : "看学期路径", "btn-path", () => {
          if (settle.practiceKind) {
            showView("records");
            renderRecords();
          } else {
            showView("path");
            renderPath();
          }
        });
        addBtn("今日一句挑战", "btn-speak", () => {
          practice.classList.remove("hidden");
          $("doneScore").textContent = "做对 " + ok + " / " + total;
          $("doneEgg").textContent = "";
          startDonePractice(egg);
        });
        addBtn("回首页", "btn-bad", () => {
          showView("home");
          renderHome();
        });
        syncWalletUI();
      }

      function scoreSpeech(heard, target) {
        const a = normalizeAnswer(heard);
        const b = normalizeAnswer(target);
        if (!a) return { ok: false, reason: "没听清，再说一次" };
        if (a === b) return { ok: true, reason: "说得很好！" };
        const aw = a.replace(/[^a-z'\s]/g, " ").split(/\s+/).filter(Boolean);
        const bw = b.replace(/[^a-z'\s]/g, " ").split(/\s+/).filter(Boolean);
        const setB = {};
        bw.forEach((w) => { setB[w] = true; });
        const hit = aw.filter((w) => setB[w]).length;
        const cover = bw.length ? hit / bw.length : 0;
        const patternOk = /\bi\s*(am|'m|feel)\b/.test(a) && /\b(because|when)\b/.test(a) && aw.length >= 5;
        if (cover >= 0.55 || (patternOk && cover >= 0.3)) {
          return { ok: true, reason: cover >= 0.55 ? "跟原句很像，真棒！" : "造句结构对了，很好！" };
        }
        return { ok: false, reason: "再试试：I'm … because / when …" };
      }

      function listenOnceEnglish() {
        return new Promise((resolve) => {
          const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (!SR) {
            resolve({ ok: false, text: "", error: "nosupport" });
            return;
          }
          const rec = new SR();
          rec.lang = (V && V.getAccent && V.getAccent() === "en-GB") ? "en-GB" : "en-US";
          rec.interimResults = false;
          rec.maxAlternatives = 3;
          let settled = false;
          const finish = (payload) => {
            if (settled) return;
            settled = true;
            try { rec.stop(); } catch (e) {}
            resolve(payload);
          };
          rec.onresult = (ev) => {
            let best = "";
            for (let i = 0; i < ev.results.length; i++) {
              const alt = ev.results[i][0];
              if (alt && alt.transcript) best = (best ? best + " " : "") + alt.transcript;
            }
            finish({ ok: true, text: best.trim(), error: null });
          };
          rec.onerror = () => finish({ ok: false, text: "", error: "error" });
          rec.onend = () => {
            if (!settled) finish({ ok: false, text: "", error: "empty" });
          };
          try {
            rec.start();
          } catch (e) {
            finish({ ok: false, text: "", error: "error" });
          }
        });
      }

      function startDonePractice(egg) {
        const box = $("donePractice");
        const home = $("btnHome");
        if (!box) return;
        box.innerHTML = "";
        home.classList.add("hidden");

        const sentence = document.createElement("div");
        sentence.className = "egg-line";
        sentence.textContent = egg;
        box.appendChild(sentence);

        const banner = coachBanner("turtle", "今日一句 · 翻翻龟领读");
        box.appendChild(banner);

        const tip = document.createElement("p");
        tip.className = "follow-tip";
        tip.textContent = "先听翻翻龟，再跟读 3 遍";
        box.appendChild(tip);

        const actions = document.createElement("div");
        actions.className = "done-actions";
        box.appendChild(actions);

        let follow = 0;
        const leadBtn = document.createElement("button");
        leadBtn.type = "button";
        leadBtn.className = "btn-speak";
        leadBtn.textContent = "听翻翻龟领读";
        const slowBtn = document.createElement("button");
        slowBtn.type = "button";
        slowBtn.className = "btn-speak secondary";
        slowBtn.textContent = "慢速 0.7×";
        const followBtn = document.createElement("button");
        followBtn.type = "button";
        followBtn.className = "btn-ok";
        followBtn.textContent = "跟读并检测（0 / 3）";
        followBtn.disabled = true;

        function playLead(rate) {
          if (V) V.speak(egg, "boyChild", rate && rate !== 1 ? { rate: rate } : undefined);
          followBtn.disabled = false;
          tip.textContent = "点「跟读并检测」：说出整句，系统检查是否说对（免费，不耗 token）";
        }

        leadBtn.addEventListener("click", () => playLead(1));
        slowBtn.addEventListener("click", () => playLead(0.7));
        followBtn.addEventListener("click", () => {
          if (followBtn.disabled) return;
          followBtn.disabled = true;
          tip.textContent = "正在听…请跟读整句英文";
          if (V) V.stop();
          listenOnceEnglish().then((res) => {
            followBtn.disabled = false;
            if (res.error === "nosupport") {
              tip.textContent = "此浏览器不支持语音检测，改为点一下算一遍";
              follow += 1;
              followBtn.textContent = "跟读并检测（" + follow + " / 3）";
              if (V) V.speak(egg, "boyChild");
              if (follow >= 3) afterFollow();
              return;
            }
            if (!res.text) {
              tip.className = "follow-tip bad";
              tip.textContent = "没听清，再跟读一次";
              return;
            }
            const judge = scoreSpeech(res.text, egg);
            tip.className = "follow-tip " + (judge.ok ? "ok" : "bad");
            tip.textContent = (judge.ok ? "第 " + (follow + 1) + " 遍过关： " : "再试：") + judge.reason;
            if (!judge.ok) return;
            follow += 1;
            followBtn.textContent = "跟读并检测（" + follow + " / 3）";
            if (follow >= 3) afterFollow();
          });
        });

        function afterFollow() {
          followBtn.disabled = true;
          leadBtn.disabled = true;
          slowBtn.disabled = true;
          tip.className = "follow-tip ok";
          tip.textContent = "跟读完成！试着模仿造句，自己说一遍";
          startSayStep();
        }

        actions.appendChild(leadBtn);
        actions.appendChild(slowBtn);
        actions.appendChild(followBtn);
        setTimeout(() => playLead(1), 200);

        function startSayStep() {
          actions.innerHTML = "";
          banner.replaceWith(coachBanner("bee", "翻翻蜂来听你造句"));
          const heard = document.createElement("p");
          heard.className = "heard-line";
          heard.textContent = "";
          box.insertBefore(heard, actions);

          const mic = document.createElement("button");
          mic.type = "button";
          mic.className = "btn-ok";
          mic.textContent = "点我说一句";
          actions.appendChild(mic);

          let busy = false;
          mic.addEventListener("click", () => {
            if (busy) return;
            busy = true;
            if (V) V.stop();
            mic.textContent = "正在听…请说英文";
            mic.disabled = true;
            tip.className = "follow-tip";
            tip.textContent = "模仿今日一句，用 I'm … because / when … 说一遍";
            heard.textContent = "";
            listenOnceEnglish().then((res) => {
              busy = false;
              mic.disabled = false;
              mic.textContent = "再说一次";
              if (res.error === "nosupport") {
                tip.textContent = "这台浏览器不支持语音识别，请用 Chrome 打开";
                tip.className = "follow-tip bad";
                home.classList.remove("hidden");
                return;
              }
              if (!res.text) {
                tip.className = "follow-tip bad";
                tip.textContent = "没听清，靠近麦克风再说完整一句";
                return;
              }
              heard.textContent = "你说了：" + res.text;
              const judge = scoreSpeech(res.text, egg);
              tip.textContent = judge.reason;
              tip.className = "follow-tip " + (judge.ok ? "ok" : "bad");
              if (judge.ok) {
                showDoneReward();
              } else if (V) {
                V.speak("Try again.", "girlChild");
              }
            });
          });
        }

        function showDoneReward() {
          box.innerHTML = "";
          const reward = document.createElement("div");
          reward.className = "done-reward";
          reward.innerHTML =
            '<div class="reward-stage">' +
            '<div class="reward-burst" aria-hidden="true"></div>' +
            '<img class="reward-char turtle" src="./assets/reward-turtle-lift.svg" alt="翻翻龟单手举重" width="132" height="132">' +
            '<img class="reward-char bee" src="./assets/reward-bee-dance.svg" alt="翻翻蜂扭屁跳舞" width="124" height="124">' +
            "</div>" +
            '<h2 class="reward-title">今日一句过关！</h2>' +
            '<p class="reward-sub">翻翻龟单手举重 · 翻翻蜂扭屁跳舞</p>';
          box.appendChild(reward);
          const again = document.createElement("button");
          again.type = "button";
          again.className = "btn-ok";
          again.textContent = "看学期路径";
          again.addEventListener("click", () => {
            showView("path");
            renderPath();
          });
          box.appendChild(again);
          home.classList.remove("hidden");
          if (V) V.speak("你真是太棒了！再接再厉！", "girlChild");
        }
      }

      function openSettings(open) {
        $("settingsOverlay").classList.toggle("hidden", !open);
        $("settingsOverlay").setAttribute("aria-hidden", open ? "false" : "true");
      }

      function renderSettings() {
        $("unitSelect").innerHTML = DATA.units
          .map((u) => '<option value="' + u.id + '">' + u.name + "</option>")
          .join("");
        $("unitSelect").value = state.unitId;
        if (V) {
          const acc = V.getAccent();
          document.querySelectorAll("[data-accent]").forEach((el) => {
            el.classList.toggle("active", el.dataset.accent === acc);
          });
          const on = V.isEnabled();
          $("btnVoiceOn").classList.toggle("active", on);
          $("btnVoiceOff").classList.toggle("active", !on);
          $("castMap").innerHTML = V.castMap()
            .map((c) => "<div><strong>" + c.label + "</strong> · " + c.voice + "</div>")
            .join("");
        }
      }

      function init() {
        try { renderHome(); } catch (e) {}
        let store = Progress.ensureProgress(loadStore());
        localStorage.setItem(STORE_KEY, JSON.stringify(store));
        if (store.unitId && DATA.units.some((u) => u.id === store.unitId)) {
          state.unitId = store.unitId;
        }
        if (store.currentPathId) state.pathId = store.currentPathId;
        if (V) {
          if (store.accent === "en-GB" || store.accent === "en-US") V.setAccent(store.accent);
          V.setEnabled(store.voiceOn !== false);
        }
        $("btnStart").addEventListener("click", () => startLesson());
        if ($("btnOpenPath")) {
          $("btnOpenPath").addEventListener("click", () => {
            showView("path");
            renderPath();
          });
        }
        if ($("btnClosePath")) {
          $("btnClosePath").addEventListener("click", () => {
            showView("home");
            renderHome();
          });
        }
        if ($("btnPathStart")) {
          $("btnPathStart").addEventListener("click", () => {
            const s = walletStore();
            startLesson(s.currentPathId);
          });
        }
        if ($("navHome")) {
          $("navHome").addEventListener("click", () => {
            showView("home");
            renderHome();
          });
        }
        if ($("navPath")) {
          $("navPath").addEventListener("click", () => {
            showView("path");
            renderPath();
          });
        }
        if ($("navRecords")) {
          $("navRecords").addEventListener("click", () => {
            showView("records");
            renderRecords();
          });
        }
        if ($("btnCloseRecords")) {
          $("btnCloseRecords").addEventListener("click", () => {
            showView("home");
            renderHome();
          });
        }
        if ($("btnRecordsToPath")) {
          $("btnRecordsToPath").addEventListener("click", () => {
            showView("path");
            renderPath();
          });
        }
        mountNavHome();
        $("btnHome").addEventListener("click", () => {
          showView("home");
          renderHome();
        });
        $("btnCloseLesson").addEventListener("click", () => {
          if (V) V.stop();
          if (confirm("结束今天的练习？未完成不记本课积分。")) {
            showView("home");
            renderHome();
          }
        });
        $("btnMute").addEventListener("click", () => {
          if (!V) return;
          const on = !V.isEnabled();
          V.setEnabled(on);
          saveStore({ voiceOn: on });
          if (!on) V.stop();
          $("btnMute").textContent = on ? "♪" : "🔇";
        });
        $("btnSettings").addEventListener("click", () => {
          renderSettings();
          openSettings(true);
        });
        $("btnCloseSettings").addEventListener("click", () => openSettings(false));
        $("settingsOverlay").addEventListener("click", (e) => {
          if (e.target === $("settingsOverlay")) openSettings(false);
        });
        $("unitSelect").addEventListener("change", () => {
          state.unitId = $("unitSelect").value;
          saveStore({ unitId: state.unitId });
          renderHome();
        });
        document.querySelectorAll("[data-accent]").forEach((el) => {
          el.addEventListener("click", () => {
            if (!V) return;
            V.setAccent(el.dataset.accent);
            saveStore({ accent: el.dataset.accent });
            renderSettings();
          });
        });
        $("btnVoiceOn").addEventListener("click", () => {
          if (!V) return;
          V.setEnabled(true);
          saveStore({ voiceOn: true });
          renderSettings();
        });
        $("btnVoiceOff").addEventListener("click", () => {
          if (!V) return;
          V.setEnabled(false);
          V.stop();
          saveStore({ voiceOn: false });
          renderSettings();
        });
        $("btnVoicePreview").addEventListener("click", () => {
          if (!V) return;
          V.speakSequence([
            { role: "adultMale", text: "Hello. I am your English agent." },
            { role: "adultFemale", text: "Listen carefully. Please write the word." },
            { role: "boyChild", text: "I feel happy because I can play." },
            { role: "girlChild", text: "What's the matter? I can help you." },
          ]);
        });

        const turtle = document.querySelector(".mascot-turtle");
        const bee = document.querySelector(".mascot-bee");
        ensurePng(turtle, "turtle");
        ensurePng(bee, "bee");
        lottieAnims.turtle = mountLottie(turtle, "turtle", true);
        lottieAnims.bee = mountLottie(bee, "bee", true);
        const homeClips = {
          turtle: "./audio/home/turtle.mp3",
          bee: "./audio/home/bee.mp3",
        };
        const homeLines = {
          turtle: { role: "boyChild", text: "每天进步一点点，有一天比兔子跑得还远。" },
          bee: { role: "girlChild", text: "嗡嗡嗡，今天你也开口了吗？" },
        };
        let homeWho = "turtle";
        let introToken = 0;
        let homeTimer = null;
        cancelHomeIntro = function () {
          introToken += 1;
          if (homeTimer) {
            clearTimeout(homeTimer);
            homeTimer = null;
          }
        };
        function homeAlive(token) {
          return token === introToken && $("screenHome") && !$("screenHome").classList.contains("hidden");
        }
        function playHomeClip(who) {
          return new Promise((resolve) => {
            if (!V || !V.isEnabled()) { resolve(); return; }
            if (!$("screenHome") || $("screenHome").classList.contains("hidden")) { resolve(); return; }
            let settled = false;
            const finish = () => {
              if (settled) return;
              settled = true;
              if (homeAudioDone === finish) homeAudioDone = null;
              resolve();
            };
            homeAudioDone = finish;
            fetch("http://127.0.0.1:8731/api/play?who=" + encodeURIComponent(who), { cache: "no-store" })
              .then((r) => {
                if (!r.ok) throw new Error("speaker");
                finish();
              })
              .catch(() => {
                if (settled) return;
                const src = homeClips[who];
                if (!src) { finish(); return; }
                const a = new Audio(src + "?v=1");
                homeAudio = a;
                a.onended = finish;
                a.onerror = finish;
                const started = a.play();
                if (started && started.catch) started.catch(finish);
              });
          });
        }
        function setHomeLine(who) {
          const line = homeLines[who];
          const lineEl = $("mascotLine");
          if (lineEl && line) lineEl.textContent = line.text;
        }
        function showHomeMascot(who) {
          homeWho = who;
          turtle.classList.toggle("is-on", who === "turtle");
          bee.classList.toggle("is-on", who === "bee");
          setHomeLine(who);
        }
        startHomeMascotLoop = function () {
          if (!turtle || !bee) return;
          cancelHomeIntro();
          stopHomeAudio();
          const token = ++introToken;
          showHomeMascot("turtle");
          function sayOnce(who) {
            if (!homeAlive(token)) return;
            if (homeSloganSaid[who]) {
              if (who === "turtle") sayOnce("bee");
              return;
            }
            homeSloganSaid[who] = true;
            playHomeClip(who).then(() => {
              if (who === "turtle") sayOnce("bee");
            });
          }
          sayOnce("turtle");
          function scheduleNext() {
            if (!homeAlive(token)) return;
            homeTimer = setTimeout(() => {
              if (!homeAlive(token)) return;
              showHomeMascot(homeWho === "turtle" ? "bee" : "turtle");
              scheduleNext();
            }, 5000);
          }
          scheduleNext();
        };

        renderHome();
        showView("home");
        if (V) setTimeout(renderSettings, 400);
      }

      init();
    })();
  </script>
</body>
