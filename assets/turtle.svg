    <path d="M44 28c4 8 8 12 16 14 8-2 12-6 16-14" fill="none" stroke="#2F7A24" stroke-width="3" stroke-linecap="round"/>
    <circle cx="60" cy="68" r="38" fill="#B8E879"/>
