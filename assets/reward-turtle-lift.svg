    <path d="M72 108c3 4 11 4 14 0" fill="none" stroke="#2B2B2B" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="62" cy="128" rx="8" ry="5" fill="#9AD45A"/>
