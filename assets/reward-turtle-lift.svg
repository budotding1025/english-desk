  <ellipse cx="48" cy="112" rx="7" ry="5" fill="#9AD45A" transform="rotate(-20 48 112)"/>
  <style><![CDATA[
    .body{transform-origin:78px 120px;animation:stance 1.1s ease-in-out infinite}
    .arm-lift{transform-origin:104px 102px;animation:lift 1.1s ease-in-out infinite}
    .barbell{transform-origin:122px 57px;animation:bar 1.1s ease-in-out infinite}
