  </g>
  <g class="arm-lift">
    <path d="M104 102c10-2 16-10 18-22" fill="none" stroke="#9AD45A" stroke-width="10" stroke-linecap="round"/>
    <circle cx="122" cy="78" r="7" fill="#9AD45A"/>
