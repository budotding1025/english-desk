<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <g class="dance">
    <ellipse class="wing-l" cx="52" cy="48" rx="18" ry="11" fill="#C8E8F8" transform="rotate(-22 52 48)"/>
    <ellipse class="wing-r" cx="108" cy="48" rx="18" ry="11" fill="#C8E8F8" transform="rotate(22 108 48)"/>
    <ellipse cx="52" cy="48" rx="10" ry="6" fill="#EEF8FF" transform="rotate(-22 52 48)"/>
    <ellipse cx="108" cy="48" rx="10" ry="6" fill="#EEF8FF" transform="rotate(22 108 48)"/>
    <line x1="58" y1="36" x2="48" y2="22" stroke="#3C3C3C" stroke-width="3" stroke-linecap="round"/>
    <line x1="102" y1="36" x2="112" y2="22" stroke="#3C3C3C" stroke-width="3" stroke-linecap="round"/>
    <circle cx="48" cy="22" r="3.2" fill="#3C3C3C"/>
    <circle cx="112" cy="22" r="3.2" fill="#3C3C3C"/>
    <circle cx="80" cy="78" r="36" fill="#FFC800"/>
    <ellipse cx="66" cy="84" rx="7" ry="7" fill="#FF9EB5"/>
    <ellipse cx="94" cy="84" rx="7" ry="7" fill="#FF9EB5"/>
    <ellipse cx="68" cy="70" rx="3.6" ry="4.6" fill="#2B2B2B"/>
    <ellipse cx="92" cy="70" rx="3.6" ry="4.6" fill="#2B2B2B"/>
    <circle cx="80" cy="78" r="2.4" fill="#E85A7A"/>
    <path d="M70 90c5 6 15 6 20 0" fill="none" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/>
    <g class="butt">
      <ellipse cx="80" cy="112" rx="18" ry="14" fill="#FFB000"/>
      <path d="M68 108h24M68 116h24" stroke="#E89A00" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
  <style><![CDATA[
    .dance{transform-origin:80px 120px;animation:bounce 0.55s ease-in-out infinite}
    .butt{transform-origin:80px 108px;animation:wiggle 0.55s ease-in-out infinite}
    .wing-l{animation:flapL 0.28s ease-in-out infinite}
    .wing-r{animation:flapR 0.28s ease-in-out infinite}
    @keyframes bounce{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-8px) rotate(6deg)}}
    @keyframes wiggle{0%,100%{transform:rotate(-18deg) translateX(-2px)}50%{transform:rotate(18deg) translateX(2px)}}
    @keyframes flapL{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(12deg)}}
    @keyframes flapR{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-12deg)}}
  ]]></style>
</svg>
